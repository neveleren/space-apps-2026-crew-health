<!doctype html>
<html lang="en">
<head>
<!-- The seven demo slides. Code and text drafted with SI (Claude, Anthropic) from the idea and decisions of the human member of team Just For Fun. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Health Console: slides</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="icon" href="data:,">
<style>
/* Seven slides, 16:9, for the Space Apps demo. Arrow keys, space or a click move between slides; print gives one slide per page. */
:root {
  /* The light display, the app's default since 15 Nov 2026 (the team's wish): the same colours as index.html's light theme. */
  --bg: #F4F6F9; --panel: #FFFFFF; --panel-2: #F2F4F6; --line: #C3C9D1; --ink: #12161B; --muted: #3F4854;
  --cmd: #166038; --cmd-edge: #166038; --lv1: #163E96; --lv2: #6B4400; --lv3: #96140C; --proc: #7A1A83; --stale: #00525A;
  --font-body: 'Atkinson Hyperlegible Next', system-ui, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Atkinson Hyperlegible Mono', ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #D5DBE2; color: var(--ink); font-family: var(--font-body); }
.deck { position: fixed; inset: 0; display: grid; place-items: center; }
.slide { position: absolute; width: 1280px; height: 720px; background: var(--bg); overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; padding: 48px 64px 28px; transform-origin: center center; }
.slide[hidden] { display: none; }
.kicker { margin: 0; font-family: var(--font-mono); font-size: 18px; letter-spacing: .06em; color: var(--muted); }
h1 { margin: 6px 0 0; font-size: 52px; line-height: 1.08; font-weight: 700; text-wrap: balance; }
h2 { margin: 6px 0 0; font-size: 40px; line-height: 1.12; font-weight: 700; text-wrap: balance; }
.body { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; min-height: 0; margin-top: 24px; }
.body.one { grid-template-columns: 1fr; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 18px; font-size: 24px; line-height: 1.35; }
.points li { display: grid; grid-template-columns: 14px 1fr; gap: 14px; }
.points li::before { content: ""; width: 10px; height: 10px; margin-top: 12px; border-radius: 2px; background: var(--cmd-edge); }
.points b { font-weight: 700; }
.shot { width: 100%; max-height: 484px; object-fit: contain; object-position: top center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.shots2 { display: grid; gap: 14px; min-height: 0; }
.shots2 .shot { height: 238px; max-height: 238px; object-fit: cover; object-position: top center; }
.quote { margin: 0; padding: 22px 26px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: inset 6px 0 0 var(--lv1); font-size: 30px; line-height: 1.3; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 4px; border: 1px solid; font-size: 20px; font-weight: 600; }
.c1 { color: var(--lv1); border-color: var(--lv1); }
.c2 { color: var(--lv2); border-color: var(--lv2); }
.c3 { color: var(--lv3); border-color: var(--lv3); }
.c0 { color: var(--muted); border-color: var(--line); }
.src { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
.foot { display: flex; justify-content: space-between; gap: 24px; align-items: end; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.foot .si { font-family: var(--font-mono); }
.big { font-size: 64px; line-height: 1.05; }
.lead { font-size: 28px; line-height: 1.35; color: var(--muted); margin: 18px 0 0; max-width: 34ch; }
.links { font-family: var(--font-mono); font-size: 22px; line-height: 1.6; }
.links a { color: var(--cmd-edge); }
.counter { position: fixed; right: 12px; top: 10px; z-index: 2; margin: 0; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.55); font-family: var(--font-mono); font-size: 13px; color: #aeb6c2; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  html, body { background: var(--bg); height: auto; }
  .deck { position: static; display: block; }
  .slide { position: relative; transform: none !important; page-break-after: always; break-after: page; }
  .slide[hidden] { display: grid; }
  .counter, .help { display: none; }
}
</style>
</head>
<body>
<main class="deck" id="deck">
  <!-- Slides are filled from slides.js so the text stays in one place. -->
</main>
<p class="counter" id="counter"></p>
<script type="module" src="./slides.js"></script>
</body>
</html>
